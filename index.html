<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imposter Party</title>
<style>
body {
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background:#0f0f14;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}
.screen {
    display:none;
    width:90%;
    max-width:500px;
}
.active { display:block; }

h1 { font-size:32px; margin-bottom:20px; }
h2 { font-size:24px; margin-bottom:20px; }

input, select {
    width:100%;
    padding:14px;
    margin:10px 0;
    font-size:18px;
    border-radius:12px;
    border:none;
}

button {
    width:100%;
    padding:16px;
    margin-top:15px;
    font-size:18px;
    border-radius:14px;
    border:none;
    background:#4a5cff;
    color:white;
    font-weight:bold;
    transition:0.2s;
}
button:active { transform:scale(0.96); }

.big-text {
    font-size:28px;
    margin:20px 0;
}

.hidden {
    visibility:hidden;
}

.fade {
    animation:fade 0.3s ease;
}
@keyframes fade {
    from {opacity:0;}
    to {opacity:1;}
}
</style>
</head>
<body>

<div id="start" class="screen active">
    <h1>Imposter Party</h1>
    <button onclick="goToPlayers()">Start Game</button>
</div>

<div id="players" class="screen">
    <h2>Number of Players</h2>
    <input type="number" id="playerCount" min="3" max="20" value="4">
    <button onclick="createNameInputs()">Next</button>
    <div id="nameInputs"></div>
</div>

<div id="category" class="screen">
    <h2>Select Category</h2>
    <select id="categorySelect"></select>
    <h2>Number of Imposters</h2>
    <input type="number" id="imposterCount" min="1" value="1">
    <button onclick="startGame()">Start Round</button>
</div>

<div id="reveal" class="screen">
    <h2 id="playerTurn"></h2>
    <button id="revealBtn" onclick="revealWord()">Reveal</button>
    <div id="wordDisplay" class="big-text hidden"></div>
    <button id="hideBtn" class="hidden" onclick="nextPlayer()">Hide & Pass</button>
</div>

<div id="end" class="screen">
    <h1>Discuss & Vote</h1>
    <button onclick="restart()">Restart</button>
</div>

<script>

// -------------------- CATEGORY GENERATOR --------------------

function generateCategory(words) {
    return words.map(w => ({
        word: w,
        hint: generateHint(w)
    }));
}

function generateHint(word) {
    return "It relates to " + word.split(" ")[0].toLowerCase() + ".";
}

// 100+ entries per category

const movieList = [
"Avatar","Titanic","Inception","Frozen","Gladiator","Jaws","Rocky","Shrek","Up","Coco",
"Cars","Aladdin","Moana","Dune","Interstellar","Joker","Batman","Superman","Spiderman","Hulk",
"Thor","Avengers","Matrix","Gravity","Toy Story","Lion King","Finding Nemo","Braveheart",
"Deadpool","Black Panther","Wonder Woman","Encanto","Bambi","Psycho","Halloween",
"Scream","Alien","Predator","Terminator","Die Hard","John Wick","Twilight","Hunger Games",
"Harry Potter","Star Wars","Indiana Jones","Minions","Despicable Me","Megamind","Bolt",
"Tangled","Mulan","Hercules","Tarzan","Zootopia","Inside Out","Soul","Onward",
"Ratatouille","Monsters Inc","Wall-E","Cars 2","Frozen 2","Top Gun","Whiplash",
"La La Land","Titan AE","The Notebook","The Ring","IT","Saw","Get Out","Us",
"Smile","Nope","Cinderella","Pinocchio","Dumbo","Snow White","The Godfather",
"Scarface","Goodfellas","Casino","Heat","Taken","Rush Hour","The Mask",
"The Grinch","Home Alone","Elf","Jumanji","Paddington","The Lego Movie",
"Madagascar","Ice Age","Rio","How to Train Your Dragon"
];

const celebrityList = [
"Taylor Swift","Drake","Beyonce","Rihanna","Ariana Grande","Justin Bieber",
"Ed Sheeran","Kanye West","The Weeknd","Bruno Mars","Billie Eilish",
"Selena Gomez","Harry Styles","Lady Gaga","Shawn Mendes","Adele",
"Post Malone","Cardi B","Nicki Minaj","Kendrick Lamar","LeBron James",
"Stephen Curry","Cristiano Ronaldo","Lionel Messi","Tom Holland",
"Zendaya","Kim Kardashian","Dwayne Johnson","Chris Hemsworth",
"Jennifer Lopez","Brad Pitt","Angelina Jolie","Leonardo DiCaprio",
"Robert Downey Jr","Scarlett Johansson","Emma Watson","Johnny Depp",
"Will Smith","Keanu Reeves","Tom Cruise","Margot Robbie","Ryan Reynolds",
"Millie Bobby Brown","Doja Cat","Travis Scott","Snoop Dogg",
"Eminem","Jay Z","Ice Cube","Kevin Hart","Jimmy Fallon",
"Ellen DeGeneres","Oprah Winfrey","Gordon Ramsay","MrBeast",
"Logan Paul","Jake Paul","PewDiePie","Mark Wahlberg",
"Vin Diesel","Gal Gadot","Henry Cavill","Daniel Radcliffe",
"Rupert Grint","Emma Stone","Chris Evans","Chris Pratt",
"Michael Jordan","Serena Williams","Simone Biles","Usain Bolt",
"David Beckham","Kylie Jenner","Kourtney Kardashian",
"Khloe Kardashian","Machine Gun Kelly","Megan Fox",
"Zac Efron","Bella Hadid","Gigi Hadid","Dua Lipa",
"Olivia Rodrigo","Camila Cabello","J Balvin",
"Bad Bunny","Maluma","Pitbull","Shakira",
"Jason Momoa","Hugh Jackman","Anne Hathaway",
"Timothee Chalamet","Florence Pugh","Tom Hardy",
"Idris Elba","Jack Black","Adam Sandler"
];

const animalList = [
"Lion","Tiger","Elephant","Giraffe","Zebra","Kangaroo","Panda","Koala","Monkey","Gorilla",
"Leopard","Cheetah","Wolf","Fox","Bear","Rabbit","Deer","Moose","Buffalo","Hippo",
"Rhino","Crocodile","Alligator","Shark","Dolphin","Whale","Octopus","Penguin",
"Eagle","Falcon","Owl","Parrot","Flamingo","Peacock","Swan","Duck","Chicken",
"Turkey","Cow","Pig","Sheep","Goat","Horse","Donkey","Camel","Llama",

"Toad","Snake","Lizard","Chameleon","Iguana","Turtle","Tortoise",

"Scorpion","Worm","Snail","Slug","Seahorse","Jellyfish",
"Starfish","Pigeon","Crow","Sparrow","Hawk","Vulture",
"Panther","Jaguar","Hyena","Meerkat","Seal","Walrus",
"Polar Bear","Armadillo","Sloth","Platypus","Ostrich",

];

const objectList = [
"Phone","Laptop","Tablet","Chair","Table","Spoon","Fork","Knife","Plate","Cup",
"Glass","Bottle","Backpack","Wallet","Keys","Remote","TV","Lamp","Clock","Watch",
"Mirror","Door","Window","Pillow","Blanket","Bed","Sofa","Desk","Pen","Pencil",
"Eraser","Notebook","Book","Headphones","Speaker","Camera","Printer",
"Toothbrush","Toothpaste","Shampoo","Soap","Towel","Comb","Brush",
"Shoes","Socks","Hat","Jacket","Gloves","Scarf","Belt",
"Ring","Necklace","Bracelet","Sunglasses","Umbrella","Fan",
"Microwave","Oven","Fridge","Freezer","Stove","Blender",
"Toaster","Pan","Pot","Bucket","Broom","Mop","Trash Can",
"Suitcase","Box","Bag","Charger","Cable","Mouse","Keyboard",
"Controller","Gamepad","Candle","Battery","Flashlight",
"Ruler","Scissors","Tape","Glue","Calculator","Thermometer",
"Scale","Helmet","Backpack","Drill","Hammer","Nail","Screw",
"Paintbrush","Canvas","Tent","Sleeping Bag"
];

const categories = {
    Movies: generateCategory(movieList),
    Celebrities: generateCategory(celebrityList),
    Animals: generateCategory(animalList),
    Objects: generateCategory(objectList)
};

// -------------------- GAME LOGIC --------------------

let players = [];
let imposters = [];
let chosenWord = null;
let currentPlayer = 0;

function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function goToPlayers(){
    show("players");
}

function createNameInputs(){
    const count = parseInt(document.getElementById("playerCount").value);
    const container = document.getElementById("nameInputs");
    container.innerHTML = "";
    players = [];

    for(let i=0;i<count;i++){
        container.innerHTML += `<input placeholder="Player ${i+1}" id="name${i}">`;
    }

    container.innerHTML += `<button onclick="goToCategory()">Continue</button>`;
}

function goToCategory(){
    const count = parseInt(document.getElementById("playerCount").value);
    players = [];

    for(let i=0;i<count;i++){
        let name = document.getElementById("name"+i).value;
        players.push(name || "Player "+(i+1));
    }

    const select = document.getElementById("categorySelect");
    select.innerHTML = "";
    Object.keys(categories).forEach(cat=>{
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    show("category");
}

function startGame(){
    const cat = document.getElementById("categorySelect").value;
    const imposterCount = parseInt(document.getElementById("imposterCount").value);

    if(imposterCount >= players.length){
        alert("Too many imposters.");
        return;
    }

    const list = categories[cat];
    chosenWord = list[Math.floor(Math.random()*list.length)];

    imposters = [];
    while(imposters.length < imposterCount){
        let r = Math.floor(Math.random()*players.length);
        if(!imposters.includes(r)) imposters.push(r);
    }

    currentPlayer = 0;
    show("reveal");
    prepareReveal();
}

function prepareReveal(){
    document.getElementById("playerTurn").innerText = players[currentPlayer] + "'s Turn";
    document.getElementById("wordDisplay").classList.add("hidden");
    document.getElementById("hideBtn").classList.add("hidden");
    document.getElementById("revealBtn").classList.remove("hidden");
}

function revealWord(){
    const display = document.getElementById("wordDisplay");

    if(imposters.includes(currentPlayer)){
        display.innerHTML = "<div style='color:#ff4d4d'>YOU ARE THE IMPOSTER</div><br><small>"+chosenWord.hint+"</small>";
    } else {
        display.innerHTML = chosenWord.word;
    }

    display.classList.remove("hidden");
    document.getElementById("hideBtn").classList.remove("hidden");
    document.getElementById("revealBtn").classList.add("hidden");
}

function nextPlayer(){
    currentPlayer++;
    if(currentPlayer >= players.length){
        show("end");
    } else {
        prepareReveal();
    }
}

function restart(){
    location.reload();
}

</script>

</body>
</html>
