<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Imposter Neon — Party Game</title>
<style>
/* =========================
   THEME & LAYOUT
   Neon Club Vibe
========================= */

:root{
  --neon-purple:#9d4dff;
  --neon-blue:#3c8dff;
  --neon-pink:#ff2fd1;
  --danger:#ff3b3b;
  --bg:#07070b;
  --card: rgba(255,255,255,0.04);
  --glass: rgba(255,255,255,0.06);
  --ease: cubic-bezier(.22,1,.36,1);
  --radius:16px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial; background:var(--bg); color:#fff; overflow:hidden}

/* moving subtle background */
body::before{
  content:"";
  position:fixed;
  left:-25%;
  top:-25%;
  width:150%;
  height:150%;
  background:
    radial-gradient(600px 400px at 20% 20%, rgba(157,77,255,0.12), transparent 10%),
    radial-gradient(600px 400px at 80% 80%, rgba(60,141,255,0.12), transparent 10%);
  animation: bgDrift 12s linear infinite alternate;
  pointer-events:none;
}
@keyframes bgDrift{ from{transform:translate(-5%, -5%)} to{transform:translate(5%,5%)} }

/* Screen container system */
.app{
  position:relative;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}

/* screen base */
.screen{
  position:absolute;
  width:100%;
  max-width:520px;
  height:calc(100% - 56px);
  left:50%;
  transform:translate(-50%,0) translateX(120%);
  transition: transform 520ms var(--ease), opacity 420ms var(--ease);
  opacity:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:28px;
  gap:12px;
}
.screen.active{ transform:translate(-50%,0) translateX(0); opacity:1 }
.screen.exit-left{ transform:translate(-50%,0) translateX(-120%); opacity:0 }

/* header */
.header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:6px;
}
.title{
  font-size:28px;
  font-weight:700;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--neon-purple),var(--neon-blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.small{
  font-size:14px;
  opacity:0.85;
}

/* card / panel */
.panel{
  width:100%;
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow: 0 6px 30px rgba(45,23,80,0.18);
  backdrop-filter: blur(8px);
}

/* inputs */
.input, select{
  width:100%;
  padding:12px 14px;
  margin:8px 0;
  border-radius:12px;
  background:var(--glass);
  color:#fff;
  border:none;
  font-size:16px;
}

/* buttons */
.btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:700;
  font-size:16px;
  color:#fff;
  cursor:pointer;
  background: linear-gradient(135deg,var(--neon-purple),var(--neon-blue));
  position:relative;
  overflow:hidden;
  transition: transform 140ms var(--ease), box-shadow 160ms var(--ease);
}
.btn:active{ transform:scale(0.97) }
.btn.secondary{ background: transparent; border:1px solid rgba(255,255,255,0.06); color:#fff; }
.btn.ghost{ background:transparent; color:#fff; border:none; opacity:0.9; }
.btn:before{
  content:"";
  position:absolute;
  left:-100%;
  top:0; bottom:0;
  width:40%;
  background:linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  transform:skewX(-18deg);
  transition:left 420ms var(--ease);
}
.btn:hover:before{ left:120% }

/* reveal card styling */
.revealCard{
  width:100%;
  border-radius:20px;
  padding:24px;
  text-align:center;
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  box-shadow: 0 10px 40px rgba(60,40,120,0.14);
  transform-origin:center;
}
.word{
  font-size:34px;
  font-weight:800;
  margin-top:12px;
  letter-spacing:0.6px;
  background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.imposterNotice{
  font-size:20px;
  font-weight:800;
  color:var(--danger);
}

/* subtle highlight for current player */
.playerHighlight{
  width:100%;
  padding:12px;
  border-radius:12px;
  margin:8px 0;
  border: 1px solid rgba(157,77,255,0.08);
}

/* small controls row */
.row{ display:flex; gap:8px; width:100% }
.col{ flex:1 }

/* back button */
.backBtn{
  background:transparent;
  color:rgba(255,255,255,0.9);
  border:none;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
}

/* animations for card reveal & imposter effects */
.revealAnim{
  animation: cardPop 420ms var(--ease) forwards;
}
@keyframes cardPop{
  0%{ transform: scale(0.94) translateY(10px); opacity:0 }
  100%{ transform: scale(1) translateY(0); opacity:1 }
}

.imposterPulse{
  animation: impPulse 900ms ease-in-out infinite;
  text-shadow: 0 0 18px rgba(255,59,59,0.9);
}
@keyframes impPulse{
  0%{ transform: scale(1); filter:brightness(1) }
  50%{ transform: scale(1.03); filter:brightness(1.05) }
  100%{ transform: scale(1); filter:brightness(1) }
}

.shake{
  animation: shakeX 520ms cubic-bezier(.36,.07,.19,.97);
}
@keyframes shakeX{
  10%,90%{ transform:translateX(-5px) }
  20%,80%{ transform:translateX(5px) }
  30%,50%,70%{ transform:translateX(-3px) }
  40%,60%{ transform:translateX(3px) }
}

/* footer small */
.footer{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  max-width:520px;
  padding:0 28px;
  pointer-events:none;
}
.footer .hint{ pointer-events:auto; opacity:0.85; font-size:13px }

@media (max-width:420px){
  .word{ font-size:28px }
  .title{ font-size:24px }
  .screen{ padding:18px }
}
</style>
</head>
<body>
<div class="app">

  <!-- START SCREEN -->
  <div id="screen-start" class="screen active">
    <div class="header">
      <div class="title">IMPOSTER</div>
      <button class="backBtn" onclick="noop()"> </button>
    </div>

    <div class="panel" style="text-align:center">
      <div style="font-size:16px; opacity:0.92; margin-bottom:10px">Party mode · single phone</div>
      <button class="btn" onclick="goTo('screen-players')">Create Game</button>
      <div style="height:14px"></div>
      <button class="btn secondary" onclick="goTo('screen-category')">Quick Play (default)</button>
    </div>
  </div>

  <!-- PLAYERS SCREEN -->
  <div id="screen-players" class="screen">
    <div class="header">
      <button class="backBtn" onclick="goBack()">← Back</button>
      <div class="title">Players</div>
      <div style="width:48px"></div>
    </div>

    <div class="panel">
      <label class="small">Number of players (3–20)</label>
      <input id="playerCount" class="input" type="number" min="3" max="20" value="4" onchange="renderPlayerInputs()" />
      <div id="playersContainer" style="margin-top:8px"></div>
      <div style="height:8px"></div>
      <div class="row">
        <div class="col"><button class="btn" onclick="collectPlayers()">Continue</button></div>
        <div class="col"><button class="btn ghost" onclick="randomFillNames()">Auto Names</button></div>
      </div>
    </div>
  </div>

  <!-- CATEGORY & SETTINGS -->
  <div id="screen-category" class="screen">
    <div class="header">
      <button class="backBtn" onclick="goBack()">← Back</button>
      <div class="title">Category & Settings</div>
      <div style="width:48px"></div>
    </div>

    <div class="panel">
      <label class="small">Choose a category</label>
      <select id="categorySelect" class="input"></select>

      <label class="small" style="margin-top:10px">Number of imposters</label>
      <input id="imposterCount" class="input" type="number" min="1" value="1" />

      <div style="height:8px"></div>
      <label class="small">
        <input id="toggleHints" type="checkbox" checked /> &nbsp; Show hints to imposters
      </label>

      <div style="height:10px"></div>
      <div class="row">
        <div class="col"><button class="btn" onclick="startGame()">Start Round</button></div>
        <div class="col"><button class="btn secondary" onclick="goBack()">Cancel</button></div>
      </div>
    </div>
  </div>

  <!-- REVEAL SCREEN -->
  <div id="screen-reveal" class="screen">
    <div class="header">
      <button class="backBtn" onclick="goBack()">← Back</button>
      <div class="title" id="turnLabel">Player's Turn</div>
      <div style="width:48px"></div>
    </div>

    <div id="revealPanel" class="panel" style="display:flex; flex-direction:column; gap:12px; align-items:stretch">
      <div id="playerHighlight" class="playerHighlight small">Player 1</div>

      <div class="revealCard" id="revealCard" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:140px">
      </div>

      <div class="row">
        <div class="col"><button id="revealBtn" class="btn" onclick="handleReveal()">Reveal</button></div>
        <div class="col"><button id="hideBtn" class="btn secondary" style="display:none" onclick="handleHide()">Hide & Pass</button></div>
      </div>
    </div>
  </div>

  <!-- FIRST PLAYER SCREEN -->
  <div id="screen-first" class="screen">
    <div class="header">
      <button class="backBtn" onclick="goBack()">← Back</button>
      <div class="title">Starting Player</div>
      <div style="width:48px"></div>
    </div>
    <div class="panel" style="text-align:center; font-size:20px">
      <div id="firstPlayerName"></div>
      <div style="height:16px"></div>
      <button class="btn" onclick="goTo('screen-end')">Continue</button>
    </div>
  </div>

  <!-- END / RESULTS SCREEN -->
  <div id="screen-end" class="screen">
    <div class="header">
      <button class="backBtn" onclick="goBack()">← Back</button>
      <div class="title">Results</div>
      <div style="width:48px"></div>
    </div>

    <div class="panel" id="resultsPanel" style="display:flex; flex-direction:column; gap:12px; align-items:stretch">
      <div style="font-size:14px; opacity:0.9">Round Summary</div>
      <div class="revealCard" id="finalCard">
        <div style="font-size:13px; opacity:0.85">Word</div>
        <div class="word" id="finalWord">---</div>
        <div style="height:12px"></div>
        <div style="font-size:13px; opacity:0.85">Imposter(s)</div>
        <div id="finalImposters" style="margin-top:8px; font-weight:700"></div>
      </div>

      <div class="row">
        <div class="col"><button class="btn" onclick="restartGame()">Restart</button></div>
        <div class="col"><button class="btn secondary" onclick="goTo('screen-start')">Home</button></div>
      </div>
    </div>
  </div>

  <div class="footer"><div></div><div class="hint">Tip: pass the phone face down. Hide screen between players.</div></div>
</div>

<script>
let players=[], currentPlayer=0, chosenWord, imposterIndexes=[], showHints=false;

function goTo(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function goBack(){ /* your existing code */ }
function noop(){}

function startGame(){
  showHints = document.getElementById('toggleHints').checked;
  const category = document.getElementById('categorySelect').value || 'Movies';
  const pool = window[category];
  chosenWord = pool[Math.floor(Math.random()*pool.length)];
  
  // Only keep ONE word hint
  chosenWord.hint = chosenWord.hint.split(' ')[0]; 
  
  currentPlayer=0;
  imposterIndexes=[];
  for(let i=0;i<Number(document.getElementById('imposterCount').value);i++){
    imposterIndexes.push(Math.floor(Math.random()*players.length));
  }
  
  goTo('screen-reveal');
  updateRevealScreen();
}

function updateRevealScreen(){
  document.getElementById('playerHighlight').innerText = players[currentPlayer];
  const card = document.getElementById('revealCard');
  card.innerHTML = '';
  if(imposterIndexes.includes(currentPlayer) && showHints){
    card.innerHTML = `<div class="imposterNotice">Imposter</div><div class="word">${chosenWord.hint}</div>`;
  } else {
    card.innerHTML = `<div class="word">${chosenWord.word}</div>`;
  }
  document.getElementById('revealBtn').style.display='inline-block';
  document.getElementById('hideBtn').style.display='none';
}

function handleReveal(){
  document.getElementById('revealBtn').style.display='none';
  document.getElementById('hideBtn').style.display='inline-block';
}

function handleHide(){
  currentPlayer++;
  if(currentPlayer<players.length){
    updateRevealScreen();
  } else {
    // After last player, show first player screen before results
    const firstPlayer = players[Math.floor(Math.random()*players.length)];
    document.getElementById('firstPlayerName').innerText = firstPlayer + " starts first!";
    goTo('screen-first');
    
    // Prepare results
    document.getElementById('finalWord').innerText = chosenWord.word;
    document.getElementById('finalImposters').innerText = imposterIndexes.map(i=>players[i]).join(', ');
  }
}

// Example functions to fill players array
function collectPlayers(){ players = []; for(let i=0;i<Number(document.getElementById('playerCount').value);i++){ players.push('Player '+(i+1)); } startGame(); }
function randomFillNames(){ collectPlayers(); }
function renderPlayerInputs(){ /* existing code */ }
function restartGame(){ goTo('screen-start'); }
</script>
</body>
</html>
